[project]
name = "maccelerate"
version = "0.1.0"
description = "Reproduce an Unsloth Dynamic GGUF's per-tensor allocation as a native Apple MLX model"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "mlx>=0.32.2",
    "numpy>=2",
]

[project.optional-dependencies]
# `maccelerate compare` needs a GGUF dequantizer to read the upstream numbers
compare = ["gguf>=0.10"]

[project.scripts]
maccelerate = "maccelerate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maccelerate"]

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/maccelerate-ai/maccelerate"
Repository = "https://github.com/maccelerate-ai/maccelerate"
Issues = "https://github.com/maccelerate-ai/maccelerate/issues"
